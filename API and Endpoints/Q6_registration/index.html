<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Q6 - Registration</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>body{font-family:system-ui,Arial;margin:20px}label{display:block;margin:8px 0}</style>
</head>
<body>
  <h2>User Registration (Q6)</h2>
  <div id="msg" style="color:red"></div>
  <form id="form">
    <label>Name <input name="name" required></label>
    <label>Email <input name="email" type="email" required></label>
    <label>Password <input name="password" type="password" required></label>
    <button type="submit">Register</button>
  </form>
<script>
document.getElementById('form').addEventListener('submit', function(e){
  e.preventDefault();
  const form = e.target;
  const name = form.name.value.trim();
  const email = form.email.value.trim();
  const password = form.password.value;
  document.getElementById('msg').textContent = 'Checking...';
  axios.get('http://localhost:3008/users', { params: { email: email } })
    .then(res => {
      if(res.data && res.data.length){
        document.getElementById('msg').textContent = 'Email already registered.';
      } else {
        axios.post('http://localhost:3008/users', { name, email, password })
          .then(()=> document.getElementById('msg').textContent = 'Registered successfully.')
          .catch(()=> document.getElementById('msg').textContent = 'Registration failed.');
      }
    }).catch(()=> document.getElementById('msg').textContent = 'Failed to check email.');
});
</script>
</body>
</html>
