<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Q10 - Registration Validation</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="RegistrationFormValidation.js" defer></script>
  <style>
    .invalid { border:2px solid red; }
    .success { color:green; }
  </style>
</head>
<body>
  <main>
    <h1>Register</h1>
    <form id="reg-form" novalidate>
      <label>Name <input id="name" name="name" required></label><br>
      <label>Email <input id="email" name="email" required></label><br>
      <label>Password <input id="password" name="password" type="password" required></label><br>
      <button type="submit">Submit</button>
    </form>

    <div id="message" aria-live="polite"></div>

    <!-- simulate existing emails for uniqueness check -->
    <script>window.existingEmails = ['demo@a.com','test@b.com','user@domain.com'];</script>
  </main>
</body>
</html>
