<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Q1 - Welcome Greeting</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="WelcomePageGreeting.js" defer></script>
</head>
<body>
  <header>
    <h1 id="greeting">Welcome!</h1>
  </header>

  <main>
    <section id="welcome-section" aria-label="Welcome area">
      <p id="welcome-msg">We're glad you're here.</p>
      <button id="change-greeting">Change Greeting</button>
      <button id="toggle-welcome">Toggle Welcome Message</button>
    </section>

    <section id="extras" aria-label="Extras">
      <p id="time-info">Time info will appear here.</p>
      <ul id="tips">
        <li>Tip 1: Stay hydrated</li>
        <li>Tip 2: Break work into chunks</li>
        <li>Tip 3: Use version control</li>
        <li>Tip 4: Write tests</li>
        <li>Tip 5: Commit often</li>
      </ul>
    </section>
  </main>

  <footer>
    <small>Q1 example</small>
  </footer>
</body>
</html>
