<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Q7 - Search Courses</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="SearchCourses.js" defer></script>
  <style>
    .course { padding:8px; border-bottom:1px solid #eee; }
    .match { background:#fff7d6; }
  </style>
</head>
<body>
  <main>
    <h1>Courses</h1>
    <input id="search" placeholder="Search courses...">
    <button id="clear">Clear</button>
    <p>Matches: <span id="count">0</span></p>

    <section id="course-list">
      <div class="course">JavaScript Essentials</div>
      <div class="course">Advanced CSS</div>
      <div class="course">React for Beginners</div>
      <div class="course">Node.js and Express</div>
      <div class="course">Data Structures</div>
      <div class="course">Algorithms & Problem Solving</div>
      <div class="course">Database Design</div>
      <div class="course">Machine Learning Basics</div>
    </section>
  </main>
</body>
</html>
